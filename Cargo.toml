[package]
name = "hippo"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
gix = { version = "0.90", default-features = false, features = ["index", "sha1"] }
hex = "0.4.3"
hf-hub = "1.0.0"
libc = "0.2.191"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "form"] }
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"

[dev-dependencies]
dirs = "7.0.0"
tempfile = "3.27.0"

[[bench]]
name = "bench"
harness = false

[profile.release]
lto = "thin"
strip = true
