name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          a=hippo-${{ matrix.target }}.tar.gz
          tar -czf $a -C target/${{ matrix.target }}/release hippo
          shasum -a 256 $a > $a.sha256
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --generate-notes || true
          gh release upload ${{ github.ref_name }} hippo-*.tar.gz* --clobber
