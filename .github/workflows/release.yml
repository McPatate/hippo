name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "existing tag to (re)build", required: true }
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  BUCKET: hf://buckets/mcpotato/hippo-releases
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.TAG }}" }
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          a=hippo-${{ matrix.target }}.tar.gz
          tar -czf $a -C target/${{ matrix.target }}/release hippo
          shasum -a 256 $a > $a.sha256
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$TAG" -R ${{ github.repository }} || gh release create "$TAG" -R ${{ github.repository }} --draft --generate-notes || true
          gh release upload "$TAG" -R ${{ github.repository }} hippo-*.tar.gz* --clobber
      - uses: astral-sh/setup-uv@v6
      - name: mirror to HF bucket
        run: |
          [ -n "$HF_TOKEN" ] || { echo "HF_TOKEN not set, skipping"; exit 0; }
          for f in hippo-*.tar.gz*; do uvx --from huggingface_hub hf buckets cp "$f" "$BUCKET/$TAG/$f"; done
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.TAG }}" }
      - uses: astral-sh/setup-uv@v6
      - name: point the HF bucket at this release
        run: |
          [ -n "$HF_TOKEN" ] || { echo "HF_TOKEN not set, skipping"; exit 0; }
          echo "$TAG" > latest.txt
          uvx --from huggingface_hub hf buckets cp install.sh "$BUCKET/install.sh"
          uvx --from huggingface_hub hf buckets cp latest.txt "$BUCKET/latest.txt"
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release edit "$TAG" -R ${{ github.repository }} --draft=false --latest
